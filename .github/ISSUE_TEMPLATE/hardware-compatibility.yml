name: New mouse / discovery result
description: Share a successful or unsuccessful test of a mouse model
title: "[Mouse]: "
body:
  - type: markdown
    attributes:
      value: |
        Your mouse does not need to be on the compatibility list. Successful,
        partial, and unsuccessful discovery results all help. Please run:

        `omus support --guided`

        and, when possible:

        `omus discover --output omus-discovery.json`

        Attach the generated files after reviewing them. Do not include credentials,
        serial numbers, input history, or private information you do not want to share.
  - type: input
    id: mouse
    attributes:
      label: Manufacturer and model
      placeholder: "Example: Logitech G305"
    validations: {required: true}
  - type: input
    id: connection
    attributes:
      label: Connection type
      placeholder: "USB wired, 2.4 GHz receiver, Bluetooth, etc."
    validations: {required: true}
  - type: input
    id: distribution
    attributes: {label: Distribution and version, placeholder: "Example: Fedora 44"}
    validations: {required: true}
  - type: input
    id: desktop
    attributes: {label: Desktop environment or compositor, placeholder: "Example: GNOME on Wayland"}
  - type: input
    id: version
    attributes: {label: OMUS version, placeholder: "Example: 0.10.0"}
    validations: {required: true}
  - type: dropdown
    id: install
    attributes:
      label: Installation method
      options: [RPM, DEB, AppImage, PKGBUILD, source, other]
    validations: {required: true}
  - type: dropdown
    id: result
    attributes:
      label: Overall result
      options: [Fully working, Mostly working, Partially working, Detected but unusable, Not detected]
    validations: {required: true}
  - type: checkboxes
    id: checks
    attributes:
      label: What did you test?
      options:
        - {label: Device detected}
        - {label: Guided Discovery completed}
        - {label: Physical DPI button was detected}
        - {label: Setup completed}
        - {label: Button remapping works}
        - {label: Configuration persists after restart}
        - {label: DPI control works}
        - {label: DPI notification works, if applicable}
        - {label: Polling-rate configuration works, if applicable}
        - {label: Mouse and mappings recover after reconnect}
        - {label: Background service works}
  - type: textarea
    id: recognition
    attributes:
      label: What did OMUS recognize?
      description: "Copy the plain-language result shown in Hardware / Discovery. No protocol knowledge is required."
      placeholder: "Example: device detected; DPI button observed; DPI write command not yet proven."
  - type: textarea
    id: details
    attributes:
      label: What worked, what failed, and any useful observations
      placeholder: "Please mention whether normal mouse operation continued to work."
    validations: {required: true}
  - type: textarea
    id: attachments
    attributes:
      label: Generated report files
      description: "Drag the support report and discovery JSON into this box. Review both files before posting."
      placeholder: "Drag files here, or explain why a report could not be created."
    validations: {required: true}
