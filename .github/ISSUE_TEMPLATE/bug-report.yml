name: Bug report
description: Report a reproducible OMUS problem
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Use **New mouse / discovery result** instead if the main question is
        whether a model is supported. Please do not include credentials, serial
        numbers, input history, or unrelated private information.
  - type: textarea
    id: happened
    attributes:
      label: What happened?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: OMUS version and installation method
      placeholder: "Example: 1.0.0 RPM"
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: Linux distribution and desktop session
      placeholder: "Example: Fedora 44, GNOME on Wayland"
  - type: textarea
    id: doctor
    attributes:
      label: Sanitized omus doctor --report output
      description: "Review before submitting; remove anything you do not want to share."
      render: text
