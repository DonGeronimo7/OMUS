name: Fix composite keyboard capture

on:
  push:
    branches: [feat/automatic-hardware-discovery]
    paths:
      - tools/fix_composite_keyboard_capture.py
      - .github/workflows/fix-composite-keyboard-capture.yml

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/automatic-hardware-discovery
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
      - name: Apply composite capture fix
        run: python tools/fix_composite_keyboard_capture.py
      - name: Install test environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install . pytest
      - name: Core button and keyboard remapping gate
        run: |
          PYTHONPATH=src pytest -q \
            tests/test_button_capture_ownership.py \
            tests/test_keyboard_capture_mouse_exclusion.py \
            tests/test_keyboard_capture.py \
            tests/test_setup_tui.py \
            tests/test_setup_state_machine.py \
            tests/test_setup_flow.py \
            tests/test_setup_persistence.py \
            tests/test_setup_service.py
      - name: Full regression gate
        run: PYTHONPATH=src pytest -q
      - name: Compile gate
        run: python -m compileall -q src tests
      - name: Whitespace gate
        run: git diff --check
      - name: Commit validated implementation
        run: |
          rm tools/fix_composite_keyboard_capture.py .github/workflows/fix-composite-keyboard-capture.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Exclude selected mouse from keyboard capture'
          git push origin HEAD:feat/automatic-hardware-discovery
