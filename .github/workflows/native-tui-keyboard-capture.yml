name: Native TUI keyboard capture

on:
  push:
    branches: [feat/automatic-hardware-discovery]
    paths:
      - tools/native_tui_keyboard_capture.py
      - .github/workflows/native-tui-keyboard-capture.yml

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/automatic-hardware-discovery
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
      - name: Apply native TUI capture patch
        run: python tools/native_tui_keyboard_capture.py
      - name: Install test environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install . pytest
      - name: Native TUI keyboard capture gate
        run: |
          PYTHONPATH=src pytest -q \
            tests/test_keyboard_capture_tui.py \
            tests/test_keyboard_capture.py \
            tests/test_button_capture_ownership.py \
            tests/test_button_capture_eagain.py \
            tests/test_setup_tui.py \
            tests/test_setup_state_machine.py
      - name: Full regression gate
        run: PYTHONPATH=src pytest -q
      - name: Compile gate
        run: python -m compileall -q src tests
      - name: Whitespace gate
        run: git diff --check
      - name: Commit validated implementation
        run: |
          rm tools/native_tui_keyboard_capture.py .github/workflows/native-tui-keyboard-capture.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Keep keyboard recording inside setup TUI'
          git push origin HEAD:feat/automatic-hardware-discovery
