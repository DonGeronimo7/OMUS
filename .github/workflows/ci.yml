name: CI

on:
  push:
    branches: [main, feat/v0.9.1-ux-fixes]
  pull_request:
    branches: [main]

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install . pytest
      - run: python -m pytest -q
      - run: python -m compileall -q src tests

  rpm:
    runs-on: ubuntu-latest
    container: fedora:44
    steps:
      - uses: actions/checkout@v5
      - name: Install RPM build tooling
        run: dnf -y install dnf-plugins-core rpm-build rpmdevtools
      - name: Install spec build requirements
        run: dnf -y builddep mouse-control.spec
      - name: Build and verify RPMs
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          python3 -m build --sdist
          rpmbuild -ba mouse-control.spec --define "_sourcedir $PWD/dist" --define "_rpmdir $PWD/rpms" --define "_srcrpmdir $PWD/rpms"
          count=$(find rpms/noarch -maxdepth 1 -type f -name 'mouse-control-*.noarch.rpm' | wc -l)
          test "$count" -eq 1
          rpm_path=$(find rpms/noarch -maxdepth 1 -type f -name 'mouse-control-*.noarch.rpm' -print -quit)
          test "$(rpm -qp --qf '%{VERSION}' "$rpm_path")" = "$version"
          rpm -qp --info "$rpm_path"
      - uses: actions/upload-artifact@v5
        with:
          name: rpm-packages
          path: rpms/
          if-no-files-found: error
