name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install . pytest
      - run: python -m pytest -q
      - run: python -m compileall -q src tests

  rpm:
    runs-on: ubuntu-latest
    container: fedora:44
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: >-
          dnf -y install
          python3-build python3-devel python3-evdev python3-pytest
          pyproject-rpm-macros rpm-build systemd-rpm-macros
      - name: Build RPMs
        run: |
          python3 -m build --sdist
          rpmbuild -ba mouse-control.spec --define "_sourcedir $PWD/dist" --define "_rpmdir $PWD/rpms" --define "_srcrpmdir $PWD/rpms"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rpm-packages
          path: rpms/
