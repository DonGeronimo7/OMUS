name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions: read-all

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548 # v6.1.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --require-hashes --requirement requirements/ci.lock.txt
      - run: python -m pytest -q
      - run: python -m compileall -q src tests scripts fuzz

  repository-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548 # v6.1.0
        with:
          python-version: '3.14'
          cache: pip
      - run: python -m pip install --require-hashes --requirement requirements/ci.lock.txt
      - name: Validate workflow security policy
        run: python scripts/validate_workflows.py
      - name: Validate dependency hash locks
        run: python scripts/verify_dependency_locks.py
      - name: Validate licensing metadata
        run: python scripts/check_license_consistency.py
      - name: Lint high-confidence correctness rules
        run: python -m ruff check src tests scripts fuzz
      - name: Verify reproducible wheel build
        run: scripts/check-wheel-reproducibility.sh

  rpm:
    runs-on: ubuntu-latest
    container: fedora:44
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false
      - name: Install RPM build tooling
        run: dnf -y install dnf-plugins-core rpm-build rpmdevtools
      - name: Install spec build requirements
        run: dnf -y builddep omus.spec
      - name: Build and verify RPMs
        run: |
          release_version=$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          release_field() { PYTHONPATH=src python3 -m mouse_control.release_version "$release_version" "$1"; }
          base_version=$(release_field rpm-version)
          package_release=$(release_field rpm-release)
          python3 -m build --sdist
          rpmbuild -ba omus.spec --define "_sourcedir $PWD/dist" --define "_rpmdir $PWD/rpms" --define "_srcrpmdir $PWD/rpms"
          count=$(find rpms/noarch -maxdepth 1 -type f -name 'omus-*.noarch.rpm' | wc -l)
          test "$count" -eq 1
          rpm_path=$(find rpms/noarch -maxdepth 1 -type f -name 'omus-*.noarch.rpm' -print -quit)
          test "$(rpm -qp --qf '%{VERSION}' "$rpm_path")" = "$base_version"
          test "$(rpm -qp --qf '%{RELEASE}' "$rpm_path" | cut -d. -f1)" = "$package_release"
          rpm -qp --info "$rpm_path"
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: rpm-packages
          path: rpms/
          if-no-files-found: error
