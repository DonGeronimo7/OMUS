[build-system]
requires = ["setuptools>=77.0.3", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "omus"
version = "1.0.0"
description = "One Mouse Universal System for Linux discovery, configuration, and remapping"
authors = [
    {name = "Marc-A. Geronimo"}
]
readme = "README.md"
license = {text = "GPL-3.0-or-later"}
requires-python = ">=3.12"
dependencies = [
    "dbus-next>=0.2.3",
    "evdev>=1.0.0",
    "packaging>=23.0"
]

[project.urls]
Homepage = "https://github.com/DonGeronimo7/OMUS"
Repository = "https://github.com/DonGeronimo7/OMUS"
Issues = "https://github.com/DonGeronimo7/OMUS/issues"
Releases = "https://github.com/DonGeronimo7/OMUS/releases"

[project.scripts]
omus = "mouse_control.app:main"
mouse-control = "mouse_control.app:main"
omus-launcher = "mouse_control.graphical_launcher:main"
mouse-control-launcher = "mouse_control.graphical_launcher:main"
mouse-control-discover = "mouse_control.discovery_cli:main"
mouse-control-sensor-calibrate = "mouse_control.sensor_calibration_cli:main"
mouse-control-write-trace = "mouse_control.write_trace_cli:main"
mouse-control-write-promote = "mouse_control.write_promotion_cli:main"
mouse-control-discovery-monitor = "mouse_control.discovery_runtime_cli:main"
mouse-control-polling-promote = "mouse_control.polling_promotion_cli:main"

[tool.setuptools.package-data]
mouse_control = ["udev/*.rules"]

[tool.setuptools]
license-files = ["LICENSE", "CREDITS.md"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
norecursedirs = ["native-hid-fallback"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82", "F401"]

[tool.ruff.lint.per-file-ignores]
"src/mouse_control/battery.py" = ["F722", "F821"]
"src/mouse_control/cli.py" = ["F821"]
