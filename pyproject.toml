[build-system]
requires = ["setuptools>=77.0.3", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mouse-control"
version = "0.9.6"
description = "Linux mouse remapping with Automatic Discovery and validated DPI/polling control"
authors = [
    {name = "Marc-A. Geronimo"}
]
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE", "CREDITS.md"]
requires-python = ">=3.12"
dependencies = [
    "dbus-next>=0.2.3",
    "evdev>=1.0.0",
    "packaging>=23.0"
]

[project.scripts]
mouse-control = "mouse_control.app:main"
mouse-control-discover = "mouse_control.discovery_cli:main"
mouse-control-sensor-calibrate = "mouse_control.sensor_calibration_cli:main"
mouse-control-write-trace = "mouse_control.write_trace_cli:main"
mouse-control-write-promote = "mouse_control.write_promotion_cli:main"
mouse-control-discovery-monitor = "mouse_control.discovery_runtime_cli:main"
mouse-control-polling-promote = "mouse_control.polling_promotion_cli:main"

[tool.setuptools.package-data]
mouse_control = ["udev/*.rules"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
norecursedirs = ["native-hid-fallback"]
